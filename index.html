<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NLC Community</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f6f7;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .composer {
      background: white;
      padding: 20px;
      margin-bottom: 25px;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    textarea {
      width: 100%;
      min-height: 100px;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
      resize: vertical;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #16875d;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .post {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .post-date {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
    }

    .post-actions {
      display: flex;
      align-items: center;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }

    .like-button {
      background: none;
      color: #555;
      border: none;
      padding: 5px;
      margin: 0;
      font-size: 15px;
      cursor: pointer;
    }

    .like-button:hover {
      color: #16875d;
      opacity: 1;
    }

    .like-button.liked {
      color: #16875d;
      font-weight: bold;
      cursor: default;
    }

    .comments {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .comment {
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .comment:last-child {
      border-bottom: none;
    }

    .comment-date {
      font-size: 11px;
      color: #999;
      margin-top: 3px;
    }

    .comment-box {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .comment-box input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      min-width: 0;
      box-sizing: border-box;
    }

    .comment-box button {
      margin-top: 0;
      padding: 10px 15px;
      white-space: nowrap;
    }

    .message {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>NLC Community</h1>

  <div class="subtitle">
    A place to learn, share and connect.
  </div>


  <!-- CREATE POST -->

  <div class="composer">

    <h2>Share with the community</h2>

    <textarea
      id="postContent"
      placeholder="What's on your mind?"></textarea>

    <button
      id="postButton"
      onclick="createPost()">
      Post
    </button>

    <div id="message" class="message"></div>

  </div>


  <!-- COMMUNITY FEED -->

  <h2>Community Feed</h2>

  <div id="posts">
    Loading posts...
  </div>


  <script>

    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL =
      'https://zbogfymmlnifzoasemlt.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_77b2DtF2XQLyfKEg7ZBNYA_odCDFWVJ';

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // LOAD POSTS
    // ==========================================

    async function loadPosts() {

      const postsContainer =
        document.getElementById('posts');

      const { data, error } =
        await supabaseClient
          .from('posts')
          .select('*')
          .order('created_at', {
            ascending: false
          });

      if (error) {

        console.error(
          'Post loading error:',
          error
        );

        postsContainer.innerHTML =
          '<p>Unable to load posts.</p>';

        return;
      }

      if (!data || data.length === 0) {

        postsContainer.innerHTML =
          '<p>No posts yet. Be the first to share something!</p>';

        return;
      }

      let html = '';

      for (const post of data) {

        html += `

          <div class="post">

            <div>
              ${escapeHtml(post.content)}
            </div>

            <div class="post-date">
              ${new Date(
                post.created_at
              ).toLocaleString()}
            </div>


            <!-- LIKE -->

            <div class="post-actions">

              <button
                class="like-button"
                id="like-button-${post.id}"
                onclick="likePost('${post.id}')">

                ❤️ Like
                <span id="like-count-${post.id}">
                  0
                </span>

              </button>

            </div>


            <!-- COMMENTS -->

            <div class="comments">

              <strong>Comments</strong>

              <div id="comments-${post.id}">
                Loading comments...
              </div>


              <div class="comment-box">

                <input
                  id="comment-${post.id}"
                  type="text"
                  placeholder="Write a comment..."
                  onkeydown="handleCommentKey(event, '${post.id}')"
                >

                <button
                  id="comment-button-${post.id}"
                  onclick="createComment('${post.id}')">

                  Comment

                </button>

              </div>

            </div>

          </div>

        `;
      }

      postsContainer.innerHTML = html;


      // Load likes and comments

      for (const post of data) {

        loadLikeCount(post.id);

        loadComments(post.id);

        checkIfLiked(post.id);

      }

    }


    // ==========================================
    // CREATE POST
    // ==========================================

    async function createPost() {

      const textarea =
        document.getElementById('postContent');

      const button =
        document.getElementById('postButton');

      const message =
        document.getElementById('message');

      const content =
        textarea.value.trim();

      if (!content) {

        message.textContent =
          'Please write something first.';

        return;
      }

      button.disabled = true;

      message.textContent =
        'Posting...';


      const { error } =
        await supabaseClient
          .from('posts')
          .insert([
            {
              content: content
            }
          ]);


      if (error) {

        console.error(
          'Post creation error:',
          error
        );

        message.textContent =
          'Unable to create post: ' +
          error.message;

        button.disabled = false;

        return;
      }


      textarea.value = '';

      message.textContent =
        'Posted!';

      button.disabled = false;


      await loadPosts();

    }


    // ==========================================
    // LOAD COMMENTS
    // ==========================================

    async function loadComments(postId) {

      const container =
        document.getElementById(
          `comments-${postId}`
        );

      if (!container) {
        return;
      }


      const { data, error } =
        await supabaseClient
          .from('comments')
          .select('*')
          .eq('post_id', postId)
          .order('created_at', {
            ascending: true
          });


      if (error) {

        console.error(
          'Comment loading error:',
          error
        );

        container.innerHTML =
          '<p>Unable to load comments.</p>';

        return;
      }


      if (!data || data.length === 0) {

        container.innerHTML =
          '<p style="color:#888;">No comments yet.</p>';

        return;
      }


      container.innerHTML =
        data.map(comment => `

          <div class="comment">

            <div>
              ${escapeHtml(comment.content)}
            </div>

            <div class="comment-date">

              ${new Date(
                comment.created_at
              ).toLocaleString()}

            </div>

          </div>

        `).join('');

    }


    // ==========================================
    // CREATE COMMENT
    // ==========================================

    async function createComment(postId) {

      const input =
        document.getElementById(
          `comment-${postId}`
        );

      const button =
        document.getElementById(
          `comment-button-${postId}`
        );


      const content =
        input.value.trim();


      if (!content) {
        return;
      }


      button.disabled = true;

      button.textContent =
        'Adding...';


      const { data, error } =
        await supabaseClient
          .from('comments')
          .insert([
            {
              post_id: postId,
              content: content
            }
          ])
          .select();


      if (error) {

        console.error(
          'Comment creation error:',
          error
        );

        alert(
          'Comment could not be added.\n\n' +
          error.message
        );

        button.disabled = false;

        button.textContent =
          'Comment';

        return;
      }


      input.value = '';

      button.disabled = false;

      button.textContent =
        'Comment';


      await loadComments(postId);

    }


    // ==========================================
    // LOAD LIKE COUNT
    // ==========================================

    async function loadLikeCount(postId) {

      const countElement =
        document.getElementById(
          `like-count-${postId}`
        );

      if (!countElement) {
        return;
      }


      const { count, error } =
        await supabaseClient
          .from('likes')
          .select('*', {
            count: 'exact',
            head: true
          })
          .eq('post_id', postId);


      if (error) {

        console.error(
          'Like count error:',
          error
        );

        countElement.textContent =
          '0';

        return;
      }


      countElement.textContent =
        count || 0;

    }


    // ==========================================
    // LIKE A POST
    // ==========================================

    async function likePost(postId) {

      const button =
        document.getElementById(
          `like-button-${postId}`
        );


      // IMPORTANT:
      // Check BEFORE inserting.
      // This prevents repeated likes
      // from the same browser.

      const alreadyLiked =
        localStorage.getItem(
          `liked-${postId}`
        );


      if (alreadyLiked === 'true') {

        return;

      }


      button.disabled = true;


      const { error } =
        await supabaseClient
          .from('likes')
          .insert([
            {
              post_id: postId
            }
          ]);


      if (error) {

        console.error(
          'Like error:',
          error
        );

        alert(
          'Unable to like this post.\n\n' +
          error.message
        );

        button.disabled = false;

        return;
      }


      // Remember this browser has liked it

      localStorage.setItem(
        `liked-${postId}`,
        'true'
      );


      // Change button appearance

      button.classList.add('liked');

      button.innerHTML =
        '❤️ Liked ' +
        `<span id="like-count-${postId}"></span>`;


      button.disabled = false;


      await loadLikeCount(postId);

    }


    // ==========================================
    // CHECK IF ALREADY LIKED
    // ==========================================

    function checkIfLiked(postId) {

      const button =
        document.getElementById(
          `like-button-${postId}`
        );

      if (!button) {
        return;
      }


      const alreadyLiked =
        localStorage.getItem(
          `liked-${postId}`
        );


      if (alreadyLiked === 'true') {

        button.classList.add('liked');

        button.innerHTML =
          '❤️ Liked ' +
          `<span id="like-count-${postId}"></span>`;

      }

    }


    // ==========================================
    // ENTER KEY FOR COMMENTS
    // ==========================================

    function handleCommentKey(event, postId) {

      if (event.key === 'Enter') {

        event.preventDefault();

        createComment(postId);

      }

    }


    // ==========================================
    // BASIC HTML SECURITY
    // ==========================================

    function escapeHtml(text) {

      const div =
        document.createElement('div');

      div.textContent = text;

      return div.innerHTML;

    }


    // ==========================================
    // START
    // ==========================================

    loadPosts();

  </script>

</body>
</html>
