<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NLC Community</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f5;
      color: #17211e;
    }

    /* =========================
       HEADER
    ========================= */

    .topbar {
      background: white;
      border-bottom: 1px solid #e3e9e6;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-inner {
      max-width: 900px;
      margin: auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }

    .brand-text {
      line-height: 1.1;
    }

    .brand-name {
      font-size: 21px;
      font-weight: 700;
      color: #087b5b;
    }

    .brand-tagline {
      font-size: 12px;
      color: #71807a;
      margin-top: 4px;
    }

    .nav-label {
      font-size: 14px;
      color: #65736e;
    }


    /* =========================
       MAIN
    ========================= */

    .container {
      max-width: 760px;
      margin: 35px auto 60px;
      padding: 0 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      margin: 0;
      font-size: 30px;
      color: #17211e;
    }

    .welcome p {
      margin: 8px 0 0;
      color: #687671;
      font-size: 15px;
    }


    /* =========================
       COMPOSER
    ========================= */

    .composer {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 32px;
      border: 1px solid #e1e8e4;
      box-shadow: 0 3px 12px rgba(0,0,0,0.04);
    }

    .composer-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .composer-title-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e7f5ef;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .composer h2 {
      margin: 0;
      font-size: 19px;
      color: #17211e;
    }

    /* NAME FIELD */

    .name-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #53615c;
      margin-bottom: 6px;
    }

    .name-input {
      width: 100%;
      padding: 11px 12px;
      margin-bottom: 12px;

      border: 1px solid #d8e1dd;
      border-radius: 9px;

      background: #fafcfb;

      font-family: inherit;
      font-size: 14px;
      color: #17211e;

      outline: none;
    }

    .name-input:focus {
      border-color: #16875d;
      background: white;
      box-shadow: 0 0 0 3px rgba(22,135,93,0.06);
    }

    .name-note {
      font-size: 11px;
      color: #89948f;
      margin-top: -7px;
      margin-bottom: 13px;
    }

    textarea {
      width: 100%;
      min-height: 105px;
      resize: vertical;

      border: 1px solid #d8e1dd;
      border-radius: 10px;

      padding: 14px;

      font-family: inherit;
      font-size: 15px;
      color: #17211e;

      outline: none;
      background: #fafcfb;
    }

    textarea:focus {
      border-color: #16875d;
      background: white;
      box-shadow: 0 0 0 3px rgba(22,135,93,0.08);
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
    }

    .composer-hint {
      font-size: 12px;
      color: #87928e;
    }

    .post-button {
      margin: 0;
      padding: 10px 22px;

      border: none;
      border-radius: 7px;

      background: #16875d;
      color: white;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    .post-button:hover {
      background: #11734f;
    }

    .post-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 10px;
      font-size: 13px;
      color: #16875d;
    }


    /* =========================
       FEED HEADER
    ========================= */

    .feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .feed-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .feed-label {
      font-size: 12px;
      color: #7a8782;
    }


    /* =========================
       POSTS
    ========================= */

    .post {
      background: white;
      border: 1px solid #e1e8e4;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;

      box-shadow: 0 3px 12px rgba(0,0,0,0.035);
    }

    .post-author {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .author-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e7f5ef;
      color: #16875d;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 14px;
      font-weight: 700;

      flex-shrink: 0;
    }

    .author-info {
      min-width: 0;
    }

    .author-name {
      font-size: 14px;
      font-weight: 700;
      color: #26322e;
    }

    .author-role {
      font-size: 11px;
      color: #8a9591;
      margin-top: 2px;
    }

    .post-content {
      font-size: 16px;
      line-height: 1.6;
      color: #17211e;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-date {
      font-size: 12px;
      color: #89948f;
      margin-top: 12px;
    }


    /* =========================
       ACTION BAR
    ========================= */

    .post-actions {
      display: flex;
      align-items: center;

      margin-top: 16px;
      padding: 10px 0;

      border-top: 1px solid #edf1ef;
      border-bottom: 1px solid #edf1ef;
    }

    .like-button {
      background: transparent;
      border: none;

      margin: 0;
      padding: 5px 8px;

      color: #596661;
      font-size: 14px;
      font-weight: 500;

      cursor: pointer;
    }

    .like-button:hover {
      color: #16875d;
    }

    .like-button.liked {
      color: #16875d;
      font-weight: 600;
      cursor: default;
    }

    .like-button:disabled {
      opacity: 1;
    }


    /* =========================
       COMMENTS
    ========================= */

    .comments {
      margin-top: 18px;
    }

    .comments-title {
      font-size: 14px;
      font-weight: 700;
      color: #26322e;
      margin-bottom: 10px;
    }

    .comment {
      background: #f7f9f8;
      border-radius: 9px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }

    .comment-author {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 5px;
    }

    .comment-avatar {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: #e7f5ef;
      color: #16875d;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 10px;
      font-weight: 700;
    }

    .comment-author-name {
      font-size: 12px;
      font-weight: 700;
      color: #53615c;
    }

    .comment-content {
      font-size: 14px;
      line-height: 1.45;
      color: #303b37;
      word-break: break-word;
    }

    .comment-date {
      font-size: 10px;
      color: #939d99;
      margin-top: 5px;
    }

    .no-comments {
      color: #8a9591;
      font-size: 13px;
      margin-bottom: 10px;
    }


    /* =========================
       COMMENT BOX
    ========================= */

    .comment-box {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .comment-box input {
      flex: 1;

      min-width: 0;

      padding: 10px 12px;

      border: 1px solid #d9e2de;
      border-radius: 8px;

      background: #fafcfb;

      font-family: inherit;
      font-size: 14px;

      outline: none;
    }

    .comment-box input:focus {
      border-color: #16875d;
      background: white;
      box-shadow: 0 0 0 3px rgba(22,135,93,0.06);
    }

    .comment-button {
      margin: 0;

      padding: 9px 17px;

      border: none;
      border-radius: 7px;

      background: #16875d;
      color: white;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
    }

    .comment-button:hover {
      background: #11734f;
    }

    .comment-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    /* =========================
       EMPTY / LOADING
    ========================= */

    .empty-state {
      background: white;
      border: 1px solid #e1e8e4;
      border-radius: 14px;
      padding: 35px 20px;
      text-align: center;
      color: #7d8985;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .topbar-inner {
        padding: 8px 14px;
      }

      .brand img {
        width: 45px;
        height: 45px;
      }

      .brand-name {
        font-size: 18px;
      }

      .brand-tagline {
        font-size: 11px;
      }

      .nav-label {
        display: none;
      }

      .container {
        margin-top: 25px;
        padding: 0 12px;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .composer {
        padding: 17px;
      }

      .composer-footer {
        align-items: flex-end;
        gap: 10px;
      }

      .composer-hint {
        max-width: 180px;
      }

      .post {
        padding: 16px;
      }

      .comment-box {
        flex-direction: row;
      }

      .comment-button {
        padding-left: 13px;
        padding-right: 13px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header class="topbar">

    <div class="topbar-inner">

      <div class="brand">

        <img
          src="NLC Logo.png"
          alt="NLC">

        <div class="brand-text">

          <div class="brand-name">
            NLC Community
          </div>

          <div class="brand-tagline">
            Learn • Share • Connect
          </div>

        </div>

      </div>

      <div class="nav-label">
        Community
      </div>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main class="container">


    <div class="welcome">

      <h1>
        Welcome to the Community
      </h1>

      <p>
        A place to learn, share and connect with one another.
      </p>

    </div>


    <!-- =========================
         CREATE POST
    ========================= -->

    <div class="composer">

      <div class="composer-title">

        <div class="composer-title-icon">
          💬
        </div>

        <h2>
          Share with the community
        </h2>

      </div>


      <label
        class="name-label"
        for="authorName">

        Your name

      </label>


      <input
        class="name-input"
        id="authorName"
        type="text"
        maxlength="80"
        placeholder="Enter your name">


      <div class="name-note">
        Your name will appear with your posts and comments.
      </div>


      <textarea
        id="postContent"
        placeholder="What's on your mind? Share something useful, a thought, a question or an idea..."></textarea>


      <div class="composer-footer">

        <div class="composer-hint">
          Keep it beneficial and respectful.
        </div>

        <button
          class="post-button"
          id="postButton"
          type="button"
          onclick="createPost()">

          Post

        </button>

      </div>


      <div
        id="message"
        class="message">
      </div>

    </div>


    <!-- =========================
         COMMUNITY FEED
    ========================= -->

    <div class="feed-header">

      <h2>
        Community Feed
      </h2>

      <div class="feed-label">
        Latest posts
      </div>

    </div>


    <div id="posts">
      Loading posts...
    </div>


  </main>


  <script>


    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL =
      'https://zbogfymmlnifzoasemlt.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_77b2DtF2XQLyfKEg7ZBNYA_odCDFWVJ';

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // NAME MEMORY
    // ==========================================

    const savedName =
      localStorage.getItem('nlc-author-name');

    if (savedName) {

      document.getElementById(
        'authorName'
      ).value = savedName;

    }


    // ==========================================
    // GET AUTHOR NAME
    // ==========================================

    function getAuthorName() {

      const nameInput =
        document.getElementById('authorName');

      const name =
        nameInput.value.trim();

      return name;

    }


    // ==========================================
    // SAVE AUTHOR NAME
    // ==========================================

    function saveAuthorName(name) {

      localStorage.setItem(
        'nlc-author-name',
        name
      );

    }


    // ==========================================
    // GET INITIALS
    // ==========================================

    function getInitials(name) {

      if (!name) {
        return '?';
      }

      const parts =
        name.trim().split(/\s+/);

      if (parts.length === 1) {
        return parts[0].substring(0, 1).toUpperCase();
      }

      return (
        parts[0].substring(0, 1) +
        parts[parts.length - 1].substring(0, 1)
      ).toUpperCase();

    }


    // ==========================================
    // LOAD POSTS
    // ==========================================

    async function loadPosts() {

      const postsContainer =
        document.getElementById('posts');

      const { data, error } =
        await supabaseClient
          .from('posts')
          .select('*')
          .order('created_at', {
            ascending: false
          });


      if (error) {

        console.error(
          'Post loading error:',
          error
        );

        postsContainer.innerHTML =
          '<div class="empty-state">Unable to load posts.</div>';

        return;
      }


      if (!data || data.length === 0) {

        postsContainer.innerHTML =
          '<div class="empty-state">No posts yet. Be the first to share something!</div>';

        return;
      }


      let html = '';


      for (const post of data) {

        const authorName =
          post.author_name || 'Community Member';

        const initials =
          getInitials(authorName);


        html += `

          <article class="post">


            <div class="post-author">

              <div class="author-avatar">
                ${escapeHtml(initials)}
              </div>

              <div class="author-info">

                <div class="author-name">
                  ${escapeHtml(authorName)}
                </div>

                <div class="author-role">
                  Community member
                </div>

              </div>

            </div>


            <div class="post-content">
              ${escapeHtml(post.content)}
            </div>


            <div class="post-date">
              ${new Date(
                post.created_at
              ).toLocaleString()}
            </div>


            <div class="post-actions">

              <button
                class="like-button"
                id="like-button-${post.id}"
                type="button"
                onclick="likePost('${post.id}')">

                ❤️ Like
                <span id="like-count-${post.id}">
                  0
                </span>

              </button>

            </div>


            <div class="comments">

              <div
                class="comments-title"
                id="comments-title-${post.id}">

                Comments

              </div>


              <div id="comments-${post.id}">
                Loading comments...
              </div>


              <div class="comment-box">

                <input
                  id="comment-${post.id}"
                  type="text"
                  maxlength="500"
                  placeholder="Write a comment..."
                  onkeydown="handleCommentKey(event, '${post.id}')"
                >


                <button
                  type="button"
                  class="comment-button"
                  id="comment-button-${post.id}"
                  data-post-id="${post.id}">

                  Comment

                </button>

              </div>

            </div>

          </article>

        `;

      }


      postsContainer.innerHTML = html;


      // Load likes and comments

      for (const post of data) {

        loadLikeCount(post.id);

        loadComments(post.id);

        checkIfLiked(post.id);

      }

    }


    // ==========================================
    // CREATE POST
    // ==========================================

    async function createPost() {

      const textarea =
        document.getElementById('postContent');

      const button =
        document.getElementById('postButton');

      const message =
        document.getElementById('message');


      const content =
        textarea.value.trim();


      const authorName =
        getAuthorName();


      if (!authorName) {

        message.textContent =
          'Please enter your name first.';

        document.getElementById(
          'authorName'
        ).focus();

        return;
      }


      if (!content) {

        message.textContent =
          'Please write something first.';

        textarea.focus();

        return;
      }


      saveAuthorName(authorName);


      button.disabled = true;

      message.textContent =
        'Posting...';


      const { error } =
        await supabaseClient
          .from('posts')
          .insert([
            {
              content: content,
              author_name: authorName
            }
          ]);


      if (error) {

        console.error(
          'Post creation error:',
          error
        );

        message.textContent =
          'Unable to create post: ' +
          error.message;

        button.disabled = false;

        return;
      }


      textarea.value = '';

      message.textContent =
        'Posted!';

      button.disabled = false;


      await loadPosts();

    }


    // ==========================================
    // LOAD COMMENTS
    // ==========================================

    async function loadComments(postId) {

      const container =
        document.getElementById(
          `comments-${postId}`
        );


      if (!container) {
        return;
      }


      const { data, error } =
        await supabaseClient
          .from('comments')
          .select('*')
          .eq('post_id', postId)
          .order('created_at', {
            ascending: true
          });


      if (error) {

        console.error(
          'Comment loading error:',
          error
        );

        container.innerHTML =
          '<div class="no-comments">Unable to load comments.</div>';

        return;
      }


      const commentCount =
        data ? data.length : 0;


      const title =
        document.getElementById(
          `comments-title-${postId}`
        );


      if (title) {

        title.textContent =
          `💬 ${commentCount} Comment${commentCount === 1 ? '' : 's'}`;

      }


      if (!data || data.length === 0) {

        container.innerHTML =
          '<div class="no-comments">No comments yet.</div>';

        return;
      }


      container.innerHTML =
        data.map(comment => {

          const commentAuthor =
            comment.author_name ||
            'Community Member';

          const initials =
            getInitials(commentAuthor);


          return `

            <div class="comment">

              <div class="comment-author">

                <div class="comment-avatar">
                  ${escapeHtml(initials)}
                </div>

                <div class="comment-author-name">
                  ${escapeHtml(commentAuthor)}
                </div>

              </div>


              <div class="comment-content">
                ${escapeHtml(comment.content)}
              </div>


              <div class="comment-date">

                ${new Date(
                  comment.created_at
                ).toLocaleString()}

              </div>

            </div>

          `;

        }).join('');

    }


    // ==========================================
    // CREATE COMMENT
    // ==========================================

    async function createComment(postId) {

      const input =
        document.getElementById(
          `comment-${postId}`
        );


      const button =
        document.getElementById(
          `comment-button-${postId}`
        );


      if (!input || !button) {
        return;
      }


      const content =
        input.value.trim();


      const authorName =
        getAuthorName();


      if (!authorName) {

        alert(
          'Please enter your name at the top before commenting.'
        );

        document.getElementById(
          'authorName'
        ).focus();

        return;
      }


      if (!content) {
        return;
      }


      saveAuthorName(authorName);


      button.disabled = true;

      button.textContent =
        'Adding...';


      const { error } =
        await supabaseClient
          .from('comments')
          .insert([
            {
              post_id: postId,
              content: content,
              author_name: authorName
            }
          ]);


      if (error) {

        console.error(
          'Comment creation error:',
          error
        );

        alert(
          'Comment could not be added.\n\n' +
          error.message
        );

        button.disabled = false;

        button.textContent =
          'Comment';

        return;
      }


      input.value = '';

      button.disabled = false;

      button.textContent =
        'Comment';


      await loadComments(postId);

    }


    // ==========================================
    // LOAD LIKE COUNT
    // ==========================================

    async function loadLikeCount(postId) {

      const countElement =
        document.getElementById(
          `like-count-${postId}`
        );


      if (!countElement) {
        return;
      }


      const { count, error } =
        await supabaseClient
          .from('likes')
          .select('*', {
            count: 'exact',
            head: true
          })
          .eq('post_id', postId);


      if (error) {

        console.error(
          'Like count error:',
          error
        );

        countElement.textContent =
          '0';

        return;
      }


      countElement.textContent =
        count || 0;

    }


    // ==========================================
    // LIKE A POST
    // ==========================================

    async function likePost(postId) {

      const button =
        document.getElementById(
          `like-button-${postId}`
        );


      if (!button) {
        return;
      }


      const alreadyLiked =
        localStorage.getItem(
          `liked-${postId}`
        );


      if (alreadyLiked === 'true') {

        return;

      }


      button.disabled = true;


      const { error } =
        await supabaseClient
          .from('likes')
          .insert([
            {
              post_id: postId
            }
          ]);


      if (error) {

        console.error(
          'Like error:',
          error
        );

        alert(
          'Unable to like this post.\n\n' +
          error.message
        );

        button.disabled = false;

        return;
      }


      localStorage.setItem(
        `liked-${postId}`,
        'true'
      );


      button.classList.add('liked');


      button.innerHTML =
        '❤️ Liked ' +
        `<span id="like-count-${postId}"></span>`;


      button.disabled = false;


      await loadLikeCount(postId);

    }


    // ==========================================
    // CHECK IF ALREADY LIKED
    // ==========================================

    function checkIfLiked(postId) {

      const button =
        document.getElementById(
          `like-button-${postId}`
        );


      if (!button) {
        return;
      }


      const alreadyLiked =
        localStorage.getItem(
          `liked-${postId}`
        );


      if (alreadyLiked === 'true') {

        button.classList.add('liked');


        button.innerHTML =
          '❤️ Liked ' +
          `<span id="like-count-${postId}"></span>`;

      }

    }


    // ==========================================
    // ENTER KEY FOR COMMENTS
    // ==========================================

    function handleCommentKey(event, postId) {

      if (event.key === 'Enter') {

        event.preventDefault();

        createComment(postId);

      }

    }


    // ==========================================
    // COMMENT BUTTON CLICK
    // ==========================================

    document.addEventListener(
      'click',
      function(event) {

        const button =
          event.target.closest(
            '.comment-button'
          );


        if (!button) {
          return;
        }


        const postId =
          button.dataset.postId;


        createComment(postId);

      }
    );


    // ==========================================
    // BASIC HTML SECURITY
    // ==========================================

    function escapeHtml(text) {

      const div =
        document.createElement('div');

      div.textContent = text;

      return div.innerHTML;

    }


    // ==========================================
    // START
    // ==========================================

    loadPosts();

  </script>

</body>
</html>
