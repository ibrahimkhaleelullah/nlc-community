<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NLC Community</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f6;color:#17211e}.topbar{background:#fff;border-bottom:1px solid #e3e9e6;position:sticky;top:0;z-index:20}.topbar-inner{max-width:900px;margin:auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px}.brand img{width:48px;height:48px;object-fit:contain}.brand-name{font-size:20px;font-weight:700;color:#087b5b}.brand-tagline{font-size:11px;color:#7b8883;margin-top:3px}.account{position:relative}.account-btn{border:1px solid #dce5e1;background:#fff;border-radius:22px;padding:8px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;color:#34413c;font-weight:600}.mini-avatar,.avatar{border-radius:50%;background:#e7f5ef;color:#16875d;display:flex;align-items:center;justify-content:center;font-weight:700}.mini-avatar{width:28px;height:28px;font-size:11px}.account-menu{display:none;position:absolute;right:0;top:48px;width:180px;background:#fff;border:1px solid #e1e8e4;border-radius:11px;box-shadow:0 10px 28px rgba(0,0,0,.10);padding:6px}.account-menu.open{display:block}.account-menu button{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:7px;cursor:pointer;color:#34413c}.account-menu button:hover{background:#f3f7f5}.container{max-width:760px;margin:28px auto 60px;padding:0 20px}.card{background:#fff;border:1px solid #e1e8e4;border-radius:14px;box-shadow:0 3px 12px rgba(0,0,0,.035)}.auth-card{padding:22px;margin-bottom:24px}.auth-card h1{font-size:22px;margin:0 0 6px}.muted{color:#71807a;font-size:13px}.tabs{display:flex;gap:7px;border-bottom:1px solid #e8eeeb;margin:18px 0 14px;padding-bottom:8px}.tab{border:0;background:transparent;padding:8px 11px;border-radius:7px;font-weight:600;color:#71807a;cursor:pointer}.tab.active{background:#e7f5ef;color:#16875d}.input,.profile-input,.profile-textarea{width:100%;padding:11px 12px;border:1px solid #d8e1dd;border-radius:8px;background:#fafcfb;font:inherit;margin-bottom:10px;outline:none}.input:focus,.profile-input:focus,.profile-textarea:focus,.composer textarea:focus,.comment-box input:focus{border-color:#16875d;box-shadow:0 0 0 3px rgba(22,135,93,.07);background:#fff}.primary{border:0;background:#16875d;color:#fff;padding:10px 17px;border-radius:8px;font-weight:600;cursor:pointer}.primary:hover{background:#11734f}.primary:disabled{opacity:.6}.auth-card .primary{width:100%}.status{font-size:12px;color:#16875d;margin-top:10px}.status.error{color:#b44747}.composer{padding:18px;margin-bottom:26px}.composer-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.composer-head .avatar{width:36px;height:36px;font-size:12px}.composer-head strong{font-size:14px}.composer textarea{width:100%;min-height:92px;resize:vertical;border:1px solid #d8e1dd;border-radius:10px;padding:13px;font:inherit;outline:none;background:#fafcfb}.composer-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.hint{font-size:11px;color:#87928e}.feed-header{display:flex;align-items:center;justify-content:space-between;margin:0 2px 13px}.feed-header h2{margin:0;font-size:20px}.feed-header span{font-size:12px;color:#7a8782}.post{padding:18px;margin-bottom:14px}.post-author{display:flex;gap:10px;align-items:center}.avatar{width:36px;height:36px;font-size:12px;flex-shrink:0}.author-name{font-size:14px;font-weight:700}.post-date{font-size:11px;color:#89948f;margin-top:2px}.post-content{font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin:14px 0}.post-actions{border-top:1px solid #edf1ef;border-bottom:1px solid #edf1ef;padding:7px 0}.like-button{border:0;background:transparent;padding:6px;color:#596661;cursor:pointer}.like-button.liked{color:#16875d;font-weight:600}.comments{margin-top:14px}.comments-title{font-size:13px;font-weight:700;margin-bottom:9px}.comment{background:#f7f9f8;border-radius:9px;padding:9px 11px;margin-bottom:7px}.comment-author{font-size:12px;font-weight:700}.comment-content{font-size:13px;line-height:1.45;margin-top:4px}.comment-date{font-size:10px;color:#939d99;margin-top:4px}.no-comments{font-size:12px;color:#8a9591;margin-bottom:9px}.comment-box{display:flex;gap:7px}.comment-box input{flex:1;min-width:0;border:1px solid #d9e2de;border-radius:8px;padding:9px 11px;font:inherit;outline:none}.comment-box button{padding:8px 12px}.empty{padding:32px;text-align:center;color:#7d8985}.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,30,25,.42);z-index:40;padding:20px;align-items:center;justify-content:center}.modal-backdrop.open{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.2);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:20px}.close{border:0;background:#f1f5f3;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px}.label{display:block;font-size:12px;font-weight:700;color:#53615c;margin-bottom:6px}.profile-input[readonly]{background:#eef2f0;color:#687671}.profile-textarea{min-height:95px;resize:vertical}.profile-note{font-size:11px;color:#89948f;margin:-5px 0 12px}.profile-actions{display:flex;justify-content:flex-end;align-items:center;gap:12px}.profile-actions .status{margin:0;margin-right:auto}.saved-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#173f33;color:#fff;padding:10px 16px;border-radius:22px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:.2s}.saved-toast.show{opacity:1}.hidden{display:none!important}
@media(max-width:600px){.topbar-inner{padding:8px 12px}.brand img{width:42px;height:42px}.brand-name{font-size:17px}.account-name{display:none}.container{padding:0 12px;margin-top:18px}.composer{padding:15px}.post{padding:15px}.hint{max-width:180px}.modal{padding:18px}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><img src="NLC Logo.png" alt="NLC"><div><div class="brand-name">NLC Community</div><div class="brand-tagline">Learn • Share • Connect</div></div></div><div id="account" class="account hidden"><button class="account-btn" onclick="toggleAccountMenu(event)"><span id="headerAvatar" class="mini-avatar">N</span><span id="headerName" class="account-name">Member</span><span>⌄</span></button><div id="accountMenu" class="account-menu"><button onclick="openProfile()">My Profile</button><button onclick="signOut()">Sign Out</button></div></div></div></header>
<main class="container">
<section id="authCard" class="card auth-card"><h1>Join the NLC Community</h1><div class="muted">Sign in to share, discuss and connect with the community.</div><div class="tabs"><button id="loginTab" class="tab active" onclick="showLogin()">Sign In</button><button id="signupTab" class="tab" onclick="showSignup()">Create Account</button></div><div id="loginForm"><input id="loginEmail" class="input" type="email" placeholder="Email address"><input id="loginPassword" class="input" type="password" placeholder="Password"><button id="loginButton" class="primary" onclick="signIn()">Sign In</button></div><div id="signupForm" class="hidden"><input id="signupName" class="input" placeholder="Your full name"><input id="signupEmail" class="input" type="email" placeholder="Email address"><input id="signupPassword" class="input" type="password" placeholder="Create a password"><button id="signupButton" class="primary" onclick="signUp()">Create Account</button></div><div id="authMessage" class="status"></div></section>
<section id="composer" class="card composer hidden"><div class="composer-head"><div id="composerAvatar" class="avatar">N</div><strong id="composerName">Community member</strong></div><textarea id="postContent" placeholder="Share a thought, question or something useful with the community..."></textarea><div class="composer-footer"><span class="hint">Keep it beneficial and respectful.</span><button id="postButton" class="primary" onclick="createPost()">Post</button></div><div id="message" class="status"></div></section>
<div class="feed-header"><h2>Community Feed</h2><span>Latest</span></div><div id="posts">Loading posts...</div>
</main>
<div id="profileModal" class="modal-backdrop" onclick="modalBackdropClick(event)"><div class="modal"><div class="modal-head"><h2>My Profile</h2><button class="close" onclick="closeProfile()">×</button></div><label class="label">Full Name</label><input id="profileName" class="profile-input" maxlength="80" oninput="saveProfileDraft()"><label class="label">Email</label><input id="profileEmail" class="profile-input" readonly><div class="profile-note">Account email</div><label class="label">Bio <span style="font-weight:400">(optional)</span></label><textarea id="profileBio" class="profile-textarea" maxlength="300" placeholder="A short introduction about yourself..." oninput="saveProfileDraft()"></textarea><div class="profile-actions"><span id="profileMessage" class="status"></span><button id="profileSaveButton" class="primary" onclick="saveProfile()">Save Changes</button></div></div></div>
<div id="savedToast" class="saved-toast">✓ Changes saved</div>
<script>
const SUPABASE_URL='https://zbogfymmlnifzoasemlt.supabase.co';
const SUPABASE_KEY='sb_publishable_77b2DtF2XQLyfKEg7ZBNYA_odCDFWVJ';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentProfile=null;
const $=id=>document.getElementById(id);
function escapeHtml(t){const d=document.createElement('div');d.textContent=t??'';return d.innerHTML}
function initials(n){const p=(n||'?').trim().split(/\s+/);return (p.length>1?p[0][0]+p[p.length-1][0]:p[0][0]).toUpperCase()}
function setStatus(id,msg,error=false){const e=$(id);if(!e)return;e.textContent=msg;e.classList.toggle('error',error)}
function showLogin(){$('loginForm').classList.remove('hidden');$('signupForm').classList.add('hidden');$('loginTab').classList.add('active');$('signupTab').classList.remove('active');setStatus('authMessage','')}
function showSignup(){$('loginForm').classList.add('hidden');$('signupForm').classList.remove('hidden');$('loginTab').classList.remove('active');$('signupTab').classList.add('active');setStatus('authMessage','')}
async function signUp(){const name=$('signupName').value.trim(),email=$('signupEmail').value.trim(),password=$('signupPassword').value,b=$('signupButton');if(!name)return setStatus('authMessage','Please enter your full name.',true);if(!email)return setStatus('authMessage','Please enter your email.',true);if(password.length<6)return setStatus('authMessage','Password must be at least 6 characters.',true);b.disabled=true;b.textContent='Creating...';const{data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:name}}});b.disabled=false;b.textContent='Create Account';if(error)return setStatus('authMessage',error.message,true);setStatus('authMessage',data.user&&!data.session?'Account created. Please check your email to confirm it.':'Account created successfully.')}
async function signIn(){const email=$('loginEmail').value.trim(),password=$('loginPassword').value,b=$('loginButton');if(!email||!password)return setStatus('authMessage','Enter your email and password.',true);b.disabled=true;b.textContent='Signing In...';const{error}=await supabaseClient.auth.signInWithPassword({email,password});b.disabled=false;b.textContent='Sign In';if(error)setStatus('authMessage',error.message,true)}
async function signOut(){if(currentUser)localStorage.removeItem(draftKey());await supabaseClient.auth.signOut();closeAccountMenu()}
async function loadProfile(user){currentProfile=null;if(!user)return;const{data,error}=await supabaseClient.from('profiles').select('id,full_name,bio').eq('id',user.id).maybeSingle();if(!error)currentProfile=data}
function userName(){if(!currentUser)return'Community Member';return currentProfile?.full_name?.trim()||currentUser.user_metadata?.full_name||currentUser.email?.split('@')[0]||'Community Member'}
function draftKey(){return`nlc-profile-draft-${currentUser?.id||'guest'}`}
function getDraft(){try{return JSON.parse(localStorage.getItem(draftKey()))}catch{return null}}
function saveProfileDraft(){if(!currentUser)return;localStorage.setItem(draftKey(),JSON.stringify({full_name:$('profileName').value,bio:$('profileBio').value}))}
function populateProfile(){if(!currentUser)return;const d=getDraft();$('profileName').value=d?.full_name??currentProfile?.full_name??userName();$('profileEmail').value=currentUser.email||'';$('profileBio').value=d?.bio??currentProfile?.bio??'';setStatus('profileMessage','')}
function updateUI(){const logged=!!currentUser;$('authCard').classList.toggle('hidden',logged);$('composer').classList.toggle('hidden',!logged);$('account').classList.toggle('hidden',!logged);if(logged){const n=userName(),i=initials(n);$('headerName').textContent=n;$('headerAvatar').textContent=i;$('composerName').textContent=n;$('composerAvatar').textContent=i;populateProfile()}}
function toggleAccountMenu(e){e.stopPropagation();$('accountMenu').classList.toggle('open')}
function closeAccountMenu(){$('accountMenu').classList.remove('open')}
document.addEventListener('click',closeAccountMenu);
function openProfile(){closeAccountMenu();populateProfile();$('profileModal').classList.add('open')}
function closeProfile(){$('profileModal').classList.remove('open')}
function modalBackdropClick(e){if(e.target===$('profileModal'))closeProfile()}
async function saveProfile(){if(!currentUser)return;const name=$('profileName').value.trim(),bio=$('profileBio').value.trim(),b=$('profileSaveButton');if(!name)return setStatus('profileMessage','Full name is required.',true);b.disabled=true;b.textContent='Saving...';const{data,error}=await supabaseClient.from('profiles').update({full_name:name,bio:bio||null,updated_at:new Date().toISOString()}).eq('id',currentUser.id).select('id,full_name,bio').single();b.disabled=false;b.textContent='Save Changes';if(error)return setStatus('profileMessage',error.message,true);currentProfile=data;localStorage.removeItem(draftKey());updateUI();closeProfile();$('savedToast').classList.add('show');setTimeout(()=>$('savedToast').classList.remove('show'),2200)}
async function createPost(){if(!currentUser)return;const content=$('postContent').value.trim(),b=$('postButton');if(!content)return setStatus('message','Write something first.',true);b.disabled=true;const{error}=await supabaseClient.from('posts').insert([{content,author_name:userName(),user_id:currentUser.id}]);b.disabled=false;if(error)return setStatus('message',error.message,true);$('postContent').value='';setStatus('message','Posted!');setTimeout(()=>setStatus('message',''),1500);await loadPosts()}
async function loadPosts(){const{data,error}=await supabaseClient.from('posts').select('*').order('created_at',{ascending:false});if(error){$('posts').innerHTML='<div class="card empty">Unable to load posts.</div>';return}if(!data?.length){$('posts').innerHTML='<div class="card empty">No posts yet. Start the first conversation.</div>';return}$('posts').innerHTML=data.map(p=>{const n=p.author_name||'Community Member';return`<article class="card post"><div class="post-author"><div class="avatar">${escapeHtml(initials(n))}</div><div><div class="author-name">${escapeHtml(n)}</div><div class="post-date">${new Date(p.created_at).toLocaleString()}</div></div></div><div class="post-content">${escapeHtml(p.content)}</div><div class="post-actions"><button class="like-button" id="like-button-${p.id}" onclick="likePost('${p.id}')">♡ Like <span id="like-count-${p.id}">0</span></button></div><div class="comments"><div class="comments-title" id="comments-title-${p.id}">Comments</div><div id="comments-${p.id}"></div><div class="comment-box"><input id="comment-${p.id}" placeholder="Write a comment..." onkeydown="if(event.key==='Enter'){event.preventDefault();createComment('${p.id}')}" ${currentUser?'':'disabled'}><button class="primary" onclick="createComment('${p.id}')" ${currentUser?'':'disabled'}>Comment</button></div></div></article>`}).join('');for(const p of data){loadLikeCount(p.id);loadComments(p.id);if(currentUser)checkLiked(p.id)}}
async function loadComments(id){const{data,error}=await supabaseClient.from('comments').select('*').eq('post_id',id).order('created_at',{ascending:true});const c=$(`comments-${id}`);if(error){c.innerHTML='<div class="no-comments">Unable to load comments.</div>';return}const count=data?.length||0;$(`comments-title-${id}`).textContent=`💬 ${count} Comment${count===1?'':'s'}`;c.innerHTML=count?data.map(x=>`<div class="comment"><div class="comment-author">${escapeHtml(x.author_name||'Community Member')}</div><div class="comment-content">${escapeHtml(x.content)}</div><div class="comment-date">${new Date(x.created_at).toLocaleString()}</div></div>`).join(''):'<div class="no-comments">No comments yet.</div>'}
async function createComment(id){if(!currentUser)return alert('Please sign in to comment.');const input=$(`comment-${id}`),content=input.value.trim();if(!content)return;const{error}=await supabaseClient.from('comments').insert([{post_id:id,content,author_name:userName(),user_id:currentUser.id}]);if(error)return alert(error.message);input.value='';await loadComments(id)}
async function loadLikeCount(id){const{count}=await supabaseClient.from('likes').select('*',{count:'exact',head:true}).eq('post_id',id);const e=$(`like-count-${id}`);if(e)e.textContent=count||0}
async function checkLiked(id){const{data}=await supabaseClient.from('likes').select('id').eq('post_id',id).eq('user_id',currentUser.id).maybeSingle();if(data){const b=$(`like-button-${id}`);if(b){b.classList.add('liked');b.innerHTML=`♥ Liked <span id="like-count-${id}"></span>`;b.disabled=true;loadLikeCount(id)}}}
async function likePost(id){if(!currentUser)return alert('Please sign in to like posts.');const b=$(`like-button-${id}`);b.disabled=true;const{error}=await supabaseClient.from('likes').insert([{post_id:id,user_id:currentUser.id}]);if(error&&error.code!=='23505'){b.disabled=false;return alert(error.message)}b.classList.add('liked');b.innerHTML=`♥ Liked <span id="like-count-${id}"></span>`;await loadLikeCount(id)}
async function applySession(user){currentUser=user;await loadProfile(user);updateUI();await loadPosts()}
supabaseClient.auth.onAuthStateChange((event,session)=>setTimeout(()=>applySession(session?.user||null),0));
(async()=>{const{data}=await supabaseClient.auth.getSession();await applySession(data.session?.user||null)})();
</script>
</body>
</html>
